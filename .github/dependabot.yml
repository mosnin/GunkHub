# Dependabot configuration — supply-chain freshness.
#
# npm: weekly PRs against the pnpm workspace root; minor and patch bumps are
#      grouped into a single PR to keep review load low, majors stay separate.
# github-actions: keeps the SHA-pinned action references in
#      .github/workflows/*.yml fresh (Dependabot updates the pin and the
#      trailing version comment together).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
