name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "claude/**"
  pull_request:
    branches:
      - main
  # Weekly advisory sweep: runs ONLY the dependency-audit job (all other jobs
  # are gated on `github.event_name != 'schedule'`) so new GHSA advisories
  # surface even when no PR lands. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values so packages that import env vars at build time don't fail.
  # Real secrets are never needed for typecheck/lint/build in CI.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
  NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # Scheduled runs are advisory sweeps — only dependency-audit runs.
    # Downstream jobs (build/test/integration) skip automatically via `needs`.
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm lint

  dependency-audit:
    # Gates on known critical/high vulnerabilities in production dependencies.
    # Runs as a separate job so registry flakiness never blocks typecheck/build.
    # Also runs on the weekly `schedule` trigger so new advisories surface
    # without waiting for a PR.
    #
    # Advisories that cannot be remediated on the current dependency lines are
    # ignored via `pnpm.auditConfig.ignoreGhsas` in the root package.json.
    # Per-GHSA rationale and revisit conditions: docs/ops/audit_ignores.md.
    # Any NEW high/critical advisory fails this job.
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Audit production dependencies (critical + high)
        continue-on-error: false
        # --audit-level=high fails only on high/critical; moderate and low are
        # reported by scheduled dependency review, not gated here.
        run: pnpm audit --prod --audit-level=high

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Convex schema drift
        run: pnpm tsx scripts/check-schema-drift.ts

  convex-refs:
    # Gates the apps/web/src/lib/convexFunctions.ts seam: those
    # `makeFunctionReference('module:fn')` strings are invisible to TypeScript
    # (convex/_generated/api.ts is an `anyApi` stub), so a wrong module, a wrong
    # function name, a query/mutation kind mismatch, or a call site passing the
    # wrong args all typecheck and fail only at runtime. This job cross-checks
    # every ref and call site against the real convex/*.ts registrations by
    # static parse — no Convex deployment, no network, no build needed, which is
    # why it runs standalone alongside typecheck/lint rather than after build.
    name: Convex Function Refs
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Convex function references
        run: pnpm tsx scripts/check-convex-refs.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    # `convex-refs` is deliberately NOT in this list. It is a correctness gate on
    # the ref table, not a precondition for compiling anything — a ref pointing at
    # the wrong Convex function builds fine. Keeping it out of `needs` means a red
    # convex-refs still fails the PR on its own without also suppressing the
    # build/test/e2e feedback the rest of the tree depends on.
    needs: [typecheck, lint, schema-drift]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    # Needs a successful build first, same reasoning as `test`: no point
    # driving a browser against a build we already know is broken.
    needs: [build]
    # Weekly schedule run is an advisory dependency-audit sweep only — see the
    # `if` comment on `typecheck` above. Excluded here for the same reason.
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # /opt/pw-browsers (used by local sandbox sessions) does not exist on
      # hosted GitHub runners — install Playwright's own Chromium here.
      # --with-deps also installs the OS-level shared libraries Chromium
      # needs on a bare Ubuntu runner.
      - name: Install Playwright Chromium
        run: pnpm --filter @agent-flight-recorder/tests exec playwright install --with-deps chromium

      # Unauthenticated tier only (see tests/e2e/auth.spec.ts for why the
      # authenticated tier is skipped rather than run here). No live Convex
      # deployment or real Clerk credentials are used or required — dummy
      # values matching playwright.config.ts's DUMMY_ENV, passed here too so
      # the webServer's `next build && next start` step has them without
      # duplicating a separate build.
      - name: Run e2e smoke suite
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZTJlLmludmFsaWQk
          CLERK_SECRET_KEY: sk_test_dummy00000000000000000000000000000000000000000
          NEXT_PUBLIC_CONVEX_URL: https://example-e2e-placeholder.convex.cloud
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          # playwright.config.ts lives at the repo root, so Playwright writes
          # its report/trace/screenshot output there too, not under tests/.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  integration-test:
    name: Integration Tests (Real Convex)
    runs-on: ubuntu-latest
    # Requires unit tests to pass before running integration tests.
    needs: [test]
    # Required secrets: CONVEX_TEST_URL, TEST_API_KEY, TEST_AGENT_ID
    # These must be configured on the repository (Settings → Secrets and variables → Actions).
    # The tests use a permanent "ci-test" Convex deployment to avoid setup/teardown flakiness.
    # When secrets are present: real-Convex integration tests run and failures block the job.
    # When secrets are absent: the describe.skipIf guard skips real-Convex tests gracefully,
    #   but a subsequent step explicitly reports the skip status so it is visible in CI.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report integration test configuration
        shell: bash
        run: |
          if [ -n "${{ secrets.CONVEX_TEST_URL }}" ]; then
            echo "::notice title=Integration Tests::Secrets are present — real-Convex integration tests WILL run."
          else
            echo "::warning title=Integration Tests::CONVEX_TEST_URL secret is not set. Real-Convex integration tests will be SKIPPED. See docs/ops/ci_setup.md to provision secrets."
          fi

      - name: Run integration tests
        env:
          CONVEX_TEST_URL: ${{ secrets.CONVEX_TEST_URL }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_AGENT_ID: ${{ secrets.TEST_AGENT_ID }}
        # Target the tests package directly and pass vitest flags after `--` so
        # they reach vitest instead of being swallowed by turbo. The path is
        # relative to the tests/ package (vitest root), so no `tests/` prefix.
        run: pnpm --filter @agent-flight-recorder/tests test -- --reporter=verbose integration/api.test.ts

      - name: Verify integration tests were not silently skipped on main
        if: github.ref == 'refs/heads/main' && secrets.CONVEX_TEST_URL == ''
        shell: bash
        run: |
          echo "::error title=Release Gate::Merging to main requires real-Convex integration tests. CONVEX_TEST_URL is not set. See docs/ops/ci_setup.md."
          exit 1
